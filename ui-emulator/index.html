<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Roblox UI emulator - spike</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #1b1d22; color: #d8dbe2; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
      #app { display: flex; height: 100%; }
      #side { width: 250px; overflow: auto; border-right: 1px solid #2c2f36; padding: 8px; flex: none; }
      #side h4 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; color: #8b93a4; }
      #side a { display: block; padding: 3px 6px; color: #c8cdd8; text-decoration: none; border-radius: 4px; cursor: pointer; }
      #side a:hover { background: #2a2e37; } #side a.on { background: #3b4a7a; color: #fff; }
      #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #bar { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #2c2f36; flex-wrap: wrap; }
      #bar button { background: #2a2e37; color: #d8dbe2; border: 1px solid #3a3f4a; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      #bar button.on { background: #3b4a7a; }
      #controls { display: flex; gap: 14px; flex-wrap: wrap; }
      #stage { flex: 1; overflow: auto; display: grid; place-items: center; padding: 16px; background: #0f1013; }
      #viewport { position: relative; background: linear-gradient(#5d7fa8, #9ab8d6); overflow: hidden; box-shadow: 0 0 0 1px #000; transform-origin: top left; }
      #err { white-space: pre-wrap; color: #ff8d8d; padding: 12px; font: 12px/1.4 ui-monospace, Consolas, monospace; }
      .rbx { position: absolute; box-sizing: border-box; }
      .rbx > .content { position: absolute; inset: 0; }
      .rbx > .txt { position: absolute; inset: 0; display: flex; pointer-events: none; }
      /* calque du contour de texte : tout en couleur de contour, sans fond ni degrade */
      .txts { background: none !important; }
      .txts, .txts * { color: var(--sc) !important; -webkit-text-stroke-color: var(--sc) !important; background: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side"></div>
      <div id="main">
        <div id="bar"></div>
        <div id="err"></div>
        <div id="stage"><div id="viewport"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
